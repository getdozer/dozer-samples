version: '3.9'

services:
  dozer:
    container_name: llm-banking-dozer
    image: public.ecr.aws/getdozer/dozer-features:latest
    working_dir: /usr/local/bin
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - ./dozer-config.yaml:/usr/local/bin/dozer-config.yaml
      - ./data:/usr/local/bin/data
      - ./.dozer:/usr/local/bin/.dozer
    tty: true

  chatbot:
    container_name: llm-banking-chatbot
    image: python:3.11-slim
    working_dir: /app
    depends_on:
      - dozer
    environment:
      DOZER_BASE_URL: http://dozer:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.server:app --host 0.0.0.0 --port 8000"
