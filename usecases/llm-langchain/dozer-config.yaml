app_name: llm-langchain
version: 1
connections:
  - name: bank_data
    config: !LocalStorage
      details:
        path: data
      tables:
        - !Table
          name: customers
          config: !Csv
            path: customers
            extension: .csv
        - !Table
          name: transactions
          config: !Csv
            path: transactions
            extension: .csv
        - !Table
          name: card_products
          config: !Csv
            path: card_products
            extension: .csv

sql: |
  SELECT
    customer_id,
    category,
    SUM(amount) as total_amount,
    COUNT(transaction_id) as transaction_count
  INTO customer_spending
  FROM transactions
  GROUP BY customer_id, category;

sources:
  - name: customers
    table_name: customers
    connection: !Ref bank_data
  - name: transactions
    table_name: transactions
    connection: !Ref bank_data
  - name: card_products
    table_name: card_products
    connection: !Ref bank_data

endpoints:
  - name: customers
    path: /customers
    table_name: customers
    index:
      primary_key:
        - customer_id
  - name: transactions
    path: /transactions
    table_name: transactions
    index:
      primary_key:
        - transaction_id
  - name: card_products
    path: /card_products
    table_name: card_products
    index:
      primary_key:
        - card_id
  - name: customer_spending
    path: /customer_spending
    table_name: customer_spending
    index:
      primary_key:
        - customer_id
        - category
