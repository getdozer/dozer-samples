version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dozer_banking_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: banking_db
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  dozer:
    image: getdozer/dozer:latest
    container_name: dozer_banking_engine
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - ./:/app
    working_dir: /app
    command: ["dozer", "-c", "dozer-config.yaml"]
